<h2>CEntry function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> CEntry(C,B: integer): integer;
</code>

<h3>Description</h3>

Returns Entry Territory #B of continent C
<p>
Returns -1 if C or B are out of range.
<p>
Entry territories are territories which are part of a continent but may be accessed from another continent.
