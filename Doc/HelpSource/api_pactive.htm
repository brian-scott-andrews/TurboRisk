<h2>PActive function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> PActive(P: integer): boolean;
</code>

<h3>Description</h3>

Returns true if player P was active at the beginning of the game, false if not or if P is out of range.
