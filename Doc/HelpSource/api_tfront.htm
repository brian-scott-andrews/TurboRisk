<h2>TFront function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TFront(T,F: integer): integer;
</code>

<h3>Description</h3>

Returns bordering enemy territory #F of territory T.
<p>
Returns -1 if T or F are out of range.
