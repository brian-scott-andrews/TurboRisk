<h2>TIsEntry function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TIsEntry(T: integer): boolean;
</code>

<h3>Description</h3>

Returns true if territory T is an Entry Territory.
<p>
Returns false if not, or if T is out of range.
<p>
Entry territories are territories which are part of a continent but may be accessed from another continent.
