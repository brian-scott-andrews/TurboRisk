<h1>TRComp</h1>

<b>TRComp</b> is an Integrated Development Environment designed to support developers in writing
and testing TurboRisk programs (<b>TRPs</b>).
<p>
TRComp helps the developer in two tasks:
<ul>
	<li>
	<a href="tp_trcomp_edit.htm">Edit</a> the source code of a TRP.
	<p>
	<li>
	<a href="tp_trcomp_run.htm">Run</a> a TRP to test how it responds to different simulated situations.
</ul>
