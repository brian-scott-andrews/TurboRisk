<h2>UBufferGet function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> UBufferGet(B: integer): double;
</code>

<h3>Description</h3>

Returns current player's buffer B. B range is 1..500.
<p>
Returns -1 if B is out of range.
