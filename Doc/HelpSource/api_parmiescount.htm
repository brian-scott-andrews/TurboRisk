<h2>PArmiesCount function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> PArmiesCount(P: integer): integer;
</code>

<h3>Description</h3>

Returns the number of armies totally controlled by player P on all of its territories.
<p>
Returns -1 if P is out of range.
