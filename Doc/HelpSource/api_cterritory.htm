<h2>CTerritory function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> CTerritory(C,T: integer): integer;
</code>

<h3>Description</h3>

Returns the ID of the territory #T belonging to continent C.
<p>
Returns -1 if T or C are out of range.
