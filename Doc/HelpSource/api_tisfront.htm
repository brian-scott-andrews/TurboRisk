<h2>TIsFront function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TIsFront(T: integer): boolean;
</code>

<h3>Description</h3>

Returns true if territory T is owned by current player and has at least one bordering
territory occupied by opponents.
<p>
Returns false if not, or if T is out of range.
