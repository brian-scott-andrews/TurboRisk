<h2>URandom function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> URandom(R: integer): double;
</code>

<h3>Description</h3>

If R&gt;0, returns an integer random number I in the range 0&lt;=I&lt;R, otherwise returns a double X in the range 0&lt;=X&lt;1
