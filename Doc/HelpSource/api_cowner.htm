<h2>COwner function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> COwner(C: integer): integer;
</code>

<h3>Description</h3>

Returns the owner of continent C, if all the territories of C are owned by the same player.
<p>
Returns 0 if C has more then one occupant.
<p>
Returns -1 if C is out of range.
