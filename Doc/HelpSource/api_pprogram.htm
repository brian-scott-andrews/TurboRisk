<h2>PProgram function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> PProgram(P: integer): string;
</code>

<h3>Description</h3>

Returns player's P program file name (lowercase) if player is computer, "human" if human.
<p>
Returns "?" if P is out of range.
