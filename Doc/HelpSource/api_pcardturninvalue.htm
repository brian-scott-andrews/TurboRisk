<h2>PCardTurnInValue function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> PCardTurnInValue(P: integer): integer;
</code>

<h3>Description</h3>

If the trade in value is based on progression, returns the value of Player P's next card turn in.
<p>
If the trade in value is based on combination, returns 0.
<p>
If P is out of range, returns -1.
