<h2>PAlive function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> PAlive(P: integer): boolean;
</code>

<h3>Description</h3>

Returns true if player P is alive, false if not or P is out of range.
<p>
A player is "alive" when it was active at the beginning of the game and it's not been eliminated during the game.
