<h2>TBordersCount function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TBordersCount(T: integer): integer;
</code>

<h3>Description</h3>

Returns the number of borders of territory T (max 6).
<p>
Returns -1 if T is out of range.
