<h2>TContinent function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TContinent(T: integer): integer;
</code>

<h3>Description</h3>

Returns the ID of the continent which territory T belongs to.
<p>
Returns -1 if T is out of range.
<p>
North America=1
<br>
South America=2
<br>
Europe=3
<br>
Africa=4
<br>
Asia=5
<br>
Australia=6
