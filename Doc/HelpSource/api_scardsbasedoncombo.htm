<h2>SCardsBasedOnCombo function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> SCardsBasedOnCombo: boolean;
</code>

<h3>Description</h3>

Returns true if the card rules are set for the trade in value to be based on combination, 
false if the trade in value is based on progression.
