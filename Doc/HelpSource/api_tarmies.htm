<h2>TArmies function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TArmies(T: integer): integer;
</code>

<h3>Description</h3>

Returns the number of armies on territory T.
<p>
Returns 0 if territory T is unassigned, -1 if T is out of range.
