<h2>TBorder function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TBorder(T,B: integer): integer;
</code>

<h3>Description</h3>

Returns bordering territory #B of territory T. 
<p>
Returns -1 if T or B are out of range.
