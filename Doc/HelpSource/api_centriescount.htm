<h2>CEntriesCount function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> CEntriesCount(C: integer): integer;
</code>

<h3>Description</h3>

Returns the number of Entry Territories on continent C (max 6).
<p>
Returns -1 if C is out of range.
<p>
Entry Territories are territories which are part of a continent but may be accessed from another continent.
