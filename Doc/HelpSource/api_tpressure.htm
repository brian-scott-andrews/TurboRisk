<h2>TPressure function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TPressure(T: integer): integer;
</code>

<h3>Description</h3>

Returns the total number of enemy armies bordering on territory T.
<p>
Returns -1 if T is out of range.
