<h2>UBufferSet procedure</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>procedure</b> UBufferSet(B: integer; V: double);
</code>

<h3>Description</h3>

Sets current player's buffer B to value V. B range is 1..500.
