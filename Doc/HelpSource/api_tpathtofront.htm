<h2>TPathToFront function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TPathToFront(T: integer): integer;
</code>

<h3>Description</h3>

Finds the shortest path to go from territory T to the closest front territory
<p>
Returns the number of the first territory in the path.
<p>
Returns 0 if T is itself a front, -1 if T is out of range.
