<h2>CBonus function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> CBonus(C: integer): integer;
</code>

<h3>Description</h3>

Returns the number of armies (per turn) which the control of continent C entitles to.
<p>
Returns -1 if C is out of range.
