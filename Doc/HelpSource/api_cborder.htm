<h2>CBorder function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> CBorder(C,B: integer): integer;
</code>

<h3>Description</h3>

Returns Border Territory #B of continent C.
<p>
Returns -1 if C or B are out of range.
<p>
Border Territories are territories which are outside the continent but may be accessed from it.
