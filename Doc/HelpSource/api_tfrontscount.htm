<h2>TFrontsCount function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TFrontsCount(T: integer): integer;
</code>

<h3>Description</h3>

Returns the number of territories bordering on territory T which are occupied by opponents.
<p>
Returns -1 if T is out of range.
