<h2>TIsMine function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TIsMine(T: integer): boolean;
</code>

<h3>Description</h3>

Returns true if territory T is owned by current player.
<p>
Returns false if not, or if T is out of range.
