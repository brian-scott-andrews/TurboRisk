<h1>Ending a game</h1>

The game ends when one of the players conquers all the territories. You may
stop the game at any time selecting the <font class=menu>File &gt; End game</font> menu item
or clicking the corresponding button on the <a href="tr_options_preferences.htm">Toolbar</a>.
