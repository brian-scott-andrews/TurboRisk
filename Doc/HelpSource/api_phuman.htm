<h2>PHuman function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> PHuman(P: integer): boolean;
</code>

<h3>Description</h3>

Returns true if P is a human player, false if P is a computer player or if P is out of range.
