<h2>TDistance function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TDistance(ST, DT: integer): integer;
</code>

<h3>Description</h3>

Returns the distance (number of borders to cross) between territories ST and DT.
<p>
Returns -1 if ST or DT are out of range.
