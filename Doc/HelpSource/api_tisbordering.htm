<h2>TIsBordering function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TIsBordering(T1,T2: integer): boolean;
</code>

<h3>Description</h3>

Returns true if territory T1 is bordering on territory T2, false if not or if T1 or T2 are out of range.
