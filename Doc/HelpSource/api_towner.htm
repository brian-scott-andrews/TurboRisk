<h2>TOwner function</h2>

<hr>

<h3>Syntax</h3>

<code>
  <b>function</b> TOwner(T: integer): integer;
</code>

<h3>Description</h3>

Returns a number in the range 1..10 corresponding to the player who owns territory T.
<p>
Returns 0 if territory T is unassigned, -1 if T is out of range.
